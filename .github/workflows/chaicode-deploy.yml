name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        run: |
          docker build -t abcd56/node-server:latest .

      - name: Docker Push
        run: |
          docker push abcd56/node-server:latest

      - name: Deploy Container
        run: |
          cd /home/megha/node-server-devops
          git pull origin main

          docker pull abcd56/node-server:latest

          docker stop node-server-container || true
          docker rm node-server-container || true

          docker run -d \
            --name node-server-container \
            -p 8000:8000 \
            --restart unless-stopped \
            abcd56/node-server:latest