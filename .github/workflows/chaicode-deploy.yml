name: Deploy NodeJS on Local VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on Local VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: megha
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/megha/node-server-devops
            git pull origin main
            npm install
            pm2 restart node-server || pm2 start index.js --name node-server